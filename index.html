<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .register-card {
      max-width: 480px;
      border: none;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.97);
    }

    .top-icon {
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.35);
    }

    .custom-input {
      border: 2px solid #eee;
      border-radius: 14px;
      padding: 14px 16px;
      transition: 0.3s;
    }

    .custom-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    .register-btn {
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: 0.3s;
    }

    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center p-4">

<div id="form"></div>

<script type="module">
import "https://cdn.jsdelivr.net/gh/keshavsoft/json-to-tag@main/docs/dist/v4/min.js";

const spec = {
  tagName: "form",
  classList: "register-card shadow-lg p-4 p-md-5",

  children: [

    {
      tagName: "div",
      classList: "text-center mb-4",

      children: [

        {
          tagName: "div",
          classList: "top-icon mb-3",

          children: [
            {
              tagName: "i",
              classList: "bi bi-mortarboard-fill",
              attributes: {
                style: "font-size: 34px;"
              }
            }
          ]
        },

        {
          tagName: "h2",
          textContent: "Student Registration",
          classList: "fw-bold mb-2"
        },

        {
          tagName: "p",
          textContent: "Enter your details to get started",
          classList: "text-muted mb-0"
        }
      ]
    },

    {
      tagName: "label",
      textContent: "Student Name",
      classList: "form-label fw-semibold"
    },

    {
      tagName: "div",
      classList: "input-group mb-4",

      children: [

        {
          tagName: "span",
          classList: "input-group-text bg-white border-0",
          children: [
            {
              tagName: "i",
              classList: "bi bi-person-fill text-primary"
            }
          ]
        },

        {
          tagName: "input",
          classList: "form-control custom-input",
          attributes: {
            type: "text",
            name: "name",
            placeholder: "Enter your full name",
            required: true
          }
        }
      ]
    },

    {
      tagName: "label",
      textContent: "Mobile Number",
      classList: "form-label fw-semibold"
    },

    {
      tagName: "div",
      classList: "input-group mb-4",

      children: [

        {
          tagName: "span",
          classList: "input-group-text bg-white border-0",
          children: [
            {
              tagName: "i",
              classList: "bi bi-phone-fill text-primary"
            }
          ]
        },

        {
          tagName: "input",
          classList: "form-control custom-input",
          attributes: {
            type: "tel",
            name: "mobile",
            placeholder: "Enter mobile number",
            required: true
          }
        }
      ]
    },

    {
      tagName: "button",
      textContent: "Register Now  →",
      classList: "btn btn-primary register-btn w-100",
      attributes: {
        type: "submit"
      }
    },

    {
      tagName: "p",
      textContent: "Simple • Fast • Secure",
      classList: "text-center text-muted small mt-4 mb-0"
    }
  ]
};

const form = window.ks.jsonToTag.buildSpecElement(spec);

form.addEventListener("submit", (e) => {
  e.preventDefault();

  console.log("Student Name:", form.elements.name.value);
  console.log("Mobile Number:", form.elements.mobile.value);
});

document.getElementById("form").append(form);
</script>

</body>
</html>
